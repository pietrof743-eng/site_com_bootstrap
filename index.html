<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Loja de pães </title>
    <link rel="icon" type="image/x-icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRc5rKF-cJohfFmyk8QQdfTOrknSKhjgdT0vLNGuIizoQ&s=10" >
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: rgb(236, 212, 130);">
    <header class="header"> 
        <h1>Loja de pães</h1>   
    </header>
    <div class="container" style="text-align: center; background-color: rgb(255, 255, 255); padding: 12px;"> 
        <h1>Melhores pães:</h1> 
        <div class="row">
            <div class="col-md-4">
                <h2>Pão francês</h2>
                <img src="pão_frances.jpg" alt="..." class="img-thumbnail">
                <h4>R$ 5,00</h4> 
            </div>
            <div class="col-md-4">
                <h2>Pão de forma</h2>
                <img src="pão_de_forma.jpg" alt="..." class="img-thumbnail">
                <h4>R$ 4,00</h4> 
            </div>
            <div class="col-md-4">
                <h2>Pão de queijo</h2>
                <img src="pão_de_queijo.jpg" alt="..." class="img-thumbnail">
                <h4>R$ 6,00</h4> 
            </div>
        </div>
        <h1>Tabela dos preços dos pães:</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">Pão</th>
                    <th scope="col">Preço</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Pão francês</td>
                    <td>R$ 5,00</td>
                </tr>
                <tr>
                    <td>Pão de forma</td>
                    <td>R$ 4,00</td>
                </tr>
                <tr>
                    <td>Pão de queijo</td>
                    <td>R$ 6,00</td>
                </tr>
                <tr>
                    <td>Pão sem glúten</td>
                    <td>R$ 8,00</td>
                </tr>
                <tr>
                    <td>Pão integral</td>
                    <td>R$ 7,00</td>
                </tr>
            </tbody>
    </div>

</body>
</html>
